<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIS Reading Challenge Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: #1a1e36;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Admin bar for Google Sheet link */
    .config-bar {
      width: 100%;
      max-width: 600px;
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 10px;
    }

    .config-bar input {
      flex: 1;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    .config-bar button {
      background: #1d3557;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Canvas overlay wrapper */
    .leaderboard-container {
      position: relative;
      width: 100%;
      max-width: 600px;
    }

    /* Fixed graphic background from Canva */
    .bg-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
    }

    /* Overlay grid positioning rows on top of Canva artwork */
    .overlay-content {
      position: absolute;
      top: 35%; /* Adjust percentage based on where rows start in your image */
      left: 8%;
      width: 84%;
      display: flex;
      flex-direction: column;
      gap: 12px; /* Spacing between student rows */
    }

    .row {
      display: grid;
      grid-template-columns: 40px 1fr 60px;
      align-items: center;
    }

    .rank-num {
      font-family: 'Fredoka', cursive;
      font-size: 22px;
      color: #1d3557;
      text-align: center;
    }

    .student-name {
      font-size: 18px;
      font-weight: 800;
      color: #1d3557;
      text-align: center;
    }

    .books-count {
      font-family: 'Fredoka', cursive;
      font-size: 22px;
      color: #1d3557;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="config-bar">
    <input type="url" id="csvUrl" placeholder="Paste published Google Sheet CSV URL...">
    <button onclick="loadSheetData()">Sync Sheet</button>
  </div>

  <div class="leaderboard-container">
    <!-- Your exported Canva design -->
    <img src="background.png" class="bg-image" alt="Reading Challenge Background">

    <!-- Live text overlay -->
    <div id="boardRows" class="overlay-content"></div>
  </div>

  <script>
    window.onload = () => {
      const saved = localStorage.getItem('gh_sheet_csv');
      if (saved) {
        document.getElementById('csvUrl').value = saved;
        loadSheetData();
      }
    };

    function loadSheetData() {
      const url = document.getElementById('csvUrl').value.trim();
      if (!url) return;
      localStorage.setItem('gh_sheet_csv', url);
      const container = document.getElementById('boardRows');

      fetch(url)
        .then(r => r.text())
        .then(csvText => {
          const lines = csvText.split(/\r?\n/).filter(l => l.trim() !== '');
          const data = [];
          lines.forEach((line, i) => {
            if (i === 0 && (line.toLowerCase().includes('name') || line.toLowerCase().includes('student'))) return;
            const cols = line.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(c => c.replace(/^\"|\"$/g, '').trim());
            if (cols.length >= 2) {
              const name = cols[0];
              const count = parseInt(cols[1], 10) || 0;
              if (name) data.push({ name, count });
            }
          });

          data.sort((a, b) => b.count - a.count);
          container.innerHTML = '';

          data.slice(0, 10).forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `
              <div class="rank-num">${index + 1}</div>
              <div class="student-name">${item.name}</div>
              <div class="books-count">${item.count}</div>
            `;
            container.appendChild(row);
          });
        });
    }
  </script>
</body>
</html>
