<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reading Champions Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --board-border: #1e293b;
      --rank1-color: #ef4444;
      --rank2-color: #f97316;
      --rank3-color: #eab308;
      --rank-default: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Outer Whiteboard Container */
    .whiteboard {
      width: 100%;
      max-width: 700px;
      background: #ffffff;
      border: 8px solid var(--board-border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.15), inset 0px 0px 15px rgba(0, 0, 0, 0.05);
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2.2rem;
      color: #1e3a8a;
      letter-spacing: 1px;
    }

    /* Admin setup section */
    .setup-box {
      background: #f1f5f9;
      border: 2px dashed #cbd5e1;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setup-box input {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 0.85rem;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }

    button.refresh {
      background: #059669;
    }

    /* Table Header */
    .table-header {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      padding: 0 10px 10px 10px;
      border-bottom: 3px solid var(--board-border);
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
    }

    .text-center { text-align: center; }
    .text-right { text-align: right; }

    /* Leaderboard Rows */
    .leaderboard {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 15px;
    }

    .row {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      align-items: center;
    }

    .rank-number {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
    }

    /* Whiteboard Pill Shape */
    .name-pill {
      border: 4px solid var(--rank-default);
      border-radius: 50px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
    }

    .dot {
      width: 12px;
      height: 12px;
      background-color: #94a3b8;
      border-radius: 50%;
    }

    .student-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
    }

    .row:nth-child(1) .name-pill { border-color: var(--rank1-color); }
    .row:nth-child(2) .name-pill { border-color: var(--rank2-color); }
    .row:nth-child(3) .name-pill { border-color: var(--rank3-color); }

    .books-badge {
      font-size: 1.4rem;
      font-weight: 700;
      color: #15803d;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="whiteboard">
    <header>
      <h1>⭐ READING CHAMPIONS ⭐</h1>
    </header>

    <div class="setup-box">
      <input type="text" id="csvUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vRIywnvqgK7XGYOwXRuNRL2PISqC6HLI9hc_S7CO03r3ta3lp3aX9R4-aLsql9_L3TjCIeWrQCoGmIK/pub?gid=1859639164&single=true&output=csv" />
      <div class="btn-group">
        <button onclick="fetchData()">Load Data</button>
        <button class="refresh" onclick="fetchData()">🔄 Refresh Leaderboard</button>
      </div>
    </div>

    <div class="table-header">
      <div class="text-center">RANK</div>
      <div>STUDENT NAME</div>
      <div class="text-right">BOOKS</div>
    </div>

    <div class="leaderboard" id="leaderboard">
      <!-- Dynamic student rows render here -->
    </div>
  </div>

  <script>
    async function fetchData() {
      const url = document.getElementById('csvUrl').value;
      if (!url) return;

      try {
        const response = await fetch(url);
        const data = await response.text();
        const rows = data.split('\n').slice(1);
        const leaderboard = document.getElementById('leaderboard');
        leaderboard.innerHTML = '';

        let students = [];

        rows.forEach(row => {
          const cols = row.split(',');
          if (cols.length >= 2) {
            const name = cols[0].trim().replace(/^"|"$/g, '');
            const books = parseInt(cols[1].trim(), 10);
            if (name && !isNaN(books)) {
              students.push({ name, books });
            }
          }
        });

        students.sort((a, b) => b.books - a.books);

        students.forEach((student, index) => {
          const rank = index + 1;
          const rowEl = document.createElement('div');
          rowEl.className = 'row';
          rowEl.innerHTML = `
            <div class="rank-number">${rank}</div>
            <div class="name-pill">
              <span class="dot"></span>
              <span class="student-name">${student.name}</span>
              <span class="dot"></span>
            </div>
            <div class="books-badge">
              <span>📗</span>
              <span>${student.books}</span>
            </div>
          `;
          leaderboard.appendChild(rowEl);
        });

      } catch (err) {
        console.error(err);
      }
    }

    fetchData();
  </script>
</body>
</html>
